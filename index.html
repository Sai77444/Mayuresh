#include <stdio.h>
#include <stdlib.h>
#include <string.h>

struct Contact {
    char name[50];
    char phone[15];
    struct Contact *next;
};

struct Contact *head = NULL;

void insertBeginning() {
    struct Contact *newNode;

    newNode = (struct Contact *)malloc(sizeof(struct Contact));

    printf("Enter name: ");
    scanf("%s", newNode->name);

    printf("Enter phone number: ");
    scanf("%s", newNode->phone);

    newNode->next = head;
    head = newNode;

    printf("Contact added successfully!\n");
}

void insertEnd() {
    struct Contact *newNode, *temp;

    newNode = (struct Contact *)malloc(sizeof(struct Contact));

    printf("Enter name: ");
    scanf("%s", newNode->name);

    printf("Enter phone number: ");
    scanf("%s", newNode->phone);

    newNode->next = NULL;

    if (head == NULL) {
        head = newNode;
    } else {
        temp = head;

        while (temp->next != NULL) {
            temp = temp->next;
        }

        temp->next = newNode;
    }

    printf("Contact added successfully!\n");
}

void deleteContact() {
    char name[50];
    struct Contact *temp, *prev;

    printf("Enter name to delete: ");
    scanf("%s", name);

    temp = head;
    prev = NULL;

    while (temp != NULL) {
        if (strcmp(temp->name, name) == 0) {

            if (prev == NULL) {
                head = temp->next;
            } else {
                prev->next = temp->next;
            }

            free(temp);
            printf("Contact deleted successfully!\n");
            return;
        }

        prev = temp;
        temp = temp->next;
    }

    printf("Contact not found!\n");
}

void searchContact() {
    char name[50];
    struct Contact *temp;

    printf("Enter name to search: ");
    scanf("%s", name);

    temp = head;

    while (temp != NULL) {
        if (strcmp(temp->name, name) == 0) {
            printf("Contact Found!\n");
            printf("Name  : %s\n", temp->name);
            printf("Phone : %s\n", temp->phone);
            return;
        }

        temp = temp->next;
    }

    printf("Contact not found!\n");
}

void displayContacts() {
    struct Contact *temp;

    if (head == NULL) {
        printf("Contact list is empty!\n");
        return;
    }

    temp = head;

    printf("\n--- Contact List ---\n");

    while (temp != NULL) {
        printf("Name  : %s\n", temp->name);
        printf("Phone : %s\n", temp->phone);
        printf("-------------------\n");

        temp = temp->next;
    }
}

void freeMemory() {
    struct Contact *temp;

    while (head != NULL) {
        temp = head;
        head = head->next;
        free(temp);
    }
}

int main() {

// Browser Navigation System using two stacks

#include <stdio.h>
#include <string.h>

#define MAX 50
#define SIZE 100

int main()
{
    char backStack[MAX][SIZE];
    char forwardStack[MAX][SIZE];

    int backTop = -1;
    int forwardTop = -1;

    char currentPage[SIZE] = "Home";
    char newPage[SIZE];

    int choice;

    do
    {
        printf("\n\n===== BROWSER NAVIGATION =====\n");
        printf("1. Visit New Page\n");
        printf("2. Back\n");
        printf("3. Forward\n");
        printf("4. Display Current Page\n");
        printf("5. Exit\n");

        printf("Enter your choice: ");
        scanf("%d", &choice);

        switch (choice)
        {
        // Visit New Page
        case 1:
            printf("Enter page name: ");
            scanf("%s", newPage);

            // Push current page into Back Stack
            backTop++;
            strcpy(backStack[backTop], currentPage);

            // Change current page
            strcpy(currentPage, newPage); 
            

            // Clear Forward Stack
            forwardTop = -1;

            printf("Current Page: %s\n", currentPage);
            break;

        // Back Navigation
        case 2:
            if (backTop == -1)
            {
                printf("No previous page available!\n");
            }
            else
            {
                // Push current page into Forward Stack
                forwardTop++;
                strcpy(forwardStack[forwardTop], currentPage);

                // Pop page from Back Stack
                strcpy(currentPage, backStack[backTop]);
                backTop--;

                printf("Current Page: %s\n", currentPage);
            }
            break;

        // Forward Navigation
        case 3:
            if (forwardTop == -1)
            {
                printf("No forward page available!\n");
            }
            else
            {
                // Push current page into Back Stack
                backTop++;
                strcpy(backStack[backTop], currentPage);

                // Pop page from Forward Stack
                strcpy(currentPage, forwardStack[forwardTop]);
                forwardTop--;

                printf("Current Page: %s\n", currentPage);
            }
            break;

        // Display Current Page
        case 4:
            printf("Current Page: %s\n", currentPage);
            break;

        // Exit
        case 5:
            printf("Exiting...\n");
            break;

        default:
            printf("Invalid choice!\n");
        }

    } while (choice != 5);

    return 0;
}

    if (front == -1 || front > rear)

#include <stdio.h>
#include <stdlib.h>

struct Node
{
    int roll;
    struct Node *left;
    struct Node *right;
};

// Create a new student node
struct Node* createNode(int roll)
{
    struct Node *newNode;

    newNode = (struct Node*)malloc(sizeof(struct Node));

    newNode->roll = roll;
    newNode->left = NULL;
    newNode->right = NULL;

    return newNode;
}

// Insert a student record
struct Node* insert(struct Node *root, int roll)
{
    if (root == NULL)
        return createNode(roll);

    if (roll < root->roll)
        root->left = insert(root->left, roll);
    else if (roll > root->roll)
        root->right = insert(root->right, roll);
    else
        printf("Roll number already exists!\n");

    return root;
}

// Search for a student
struct Node* search(struct Node *root, int roll)
{
    if (root == NULL || root->roll == roll)
        return root;

    if (roll < root->roll)
        return search(root->left, roll);

    return search(root->right, roll);
}

// Find the minimum node in a subtree
struct Node* findMin(struct Node *root)
{
    while (root != NULL && root->left != NULL)
        root = root->left;

    return root;
}

// Delete a student record
struct Node* deleteNode(struct Node *root, int roll)
{
    struct Node *temp;

    if (root == NULL)
    {
        printf("Student record not found!\n");
        return root;
    }

    if (roll < root->roll)
        root->left = deleteNode(root->left, roll);
    else if (roll > root->roll)
        root->right = deleteNode(root->right, roll);
    else
    {
        // Case 1: No child
        if (root->left == NULL && root->right == NULL)
        {
            free(root);
            return NULL;
        }

        // Case 2: One child
        else if (root->left == NULL)
        {
            temp = root->right;
            free(root);
            return temp;
        }
        else if (root->right == NULL)
        {
            temp = root->left;
            free(root);
            return temp;
        }

        // Case 3: Two children
        temp = findMin(root->right);
        root->roll = temp->roll;
        root->right = deleteNode(root->right, temp->roll);
    }

    return root;
}

// Inorder: Left, Root, Right
void inorder(struct Node *root)
{
    if (root != NULL)
    {
        inorder(root->left);
        printf("%d ", root->roll);
        inorder(root->right);
    }
}

// Preorder: Root, Left, Right
void preorder(struct Node *root)
{
    if (root != NULL)
    {
        printf("%d ", root->roll);
        preorder(root->left);
        preorder(root->right);
    }
}

// Postorder: Left, Right, Root
void postorder(struct Node *root)
{
    if (root != NULL)
    {
        postorder(root->left);
        postorder(root->right);
        printf("%d ", root->roll);
    }
}

// Main function
int main()
{
    struct Node *root = NULL;
    struct Node *result;
    int choice, roll;

    do
    {
        printf("\n\n--- Student Record Management ---\n");
        printf("1. Add Student\n");
        printf("2. Remove Student\n");
        printf("3. Search Student\n");
        printf("4. Inorder Traversal\n");
        printf("5. Preorder Traversal\n");
        printf("6. Postorder Traversal\n");
        printf("7. Exit\n");
        printf("Enter your choice: ");
        scanf("%d", &choice);

        switch (choice)
        {
            case 1:
                printf("Enter roll number: ");
                scanf("%d", &roll);
                root = insert(root, roll);
                break;

            case 2:
                printf("Enter roll number to delete: ");
                scanf("%d", &roll);

                if (search(root, roll) == NULL)
                    printf("Student record not found!\n");
                else
                {
                    root = deleteNode(root, roll);
                    printf("Student record deleted successfully.\n");
                }
                break;

            case 3:
                printf("Enter roll number to search: ");

                result = search(root, roll);

                if (result != NULL)
                    printf("Student with roll number %d found.\n",

#include <stdio.h>
#define MAX 10

int graph[MAX][MAX] = {0};
int visited[MAX];
int n;

// Add connection
void addConnection(int a, int b) {
    graph[a][b] = 1;
    graph[b][a] = 1;
    printf("Connection added!\n");
}

// BFS
void BFS(int start) {
    int queue[MAX], front = 0, rear = 0;
    int i, current;

    for(i = 0; i < n; i++)
        visited[i] = 0;

    queue[rear++] = start;
    visited[start] = 1;

    printf("BFS: ");

    while(front < rear) {
        current = queue[front++];
        printf("%d ", current);

        for(i = 0; i < n; i++) {
            if(graph[current][i] == 1 && !visited[i]) {
                queue[rear++] = i;
                visited[i] = 1;
            }
        }
    }
    printf("\n");
}

// DFS
void DFS(int start) {
    int i;
    visited[start] = 1;
    printf("%d ", start);

    for(i = 0; i < n; i++) {
        if(graph[start][i] == 1 && !visited[i]) {
            DFS(i);
        }
    }
}

int main() {
    int choice, a, b, start, i;

    printf("Enter number of users (max 10): ");
    scanf("%d", &n);

    if(n < 1 || n > MAX) {
        printf("Invalid number of users!\n");
        return 0;
    }

    do {
        printf("\n1. Add Connection");
        printf("\n2. BFS");
        printf("\n3. DFS");
        printf("\n4. Exit");
        printf("\nEnter choice: ");
        scanf("%d", &choice);

        switch(choice) {
            case 1:
                printf("Enter two users (0 to %d): ", n-1);
                scanf("%d %d", &a, &b);

                if(a >= 0 && a < n && b >= 0 && b < n)
                    addConnection(a, b);
                else
                    printf("Invalid users!\n");
                break;

            case 2:
                printf("Enter starting user: ");
                scanf("%d", &start);

                if(start >= 0 && start < n)
                    BFS(start);
                else
                    printf("Invalid user!\n");
                break;

            case 3:
                printf("Enter starting user: ");
                scanf("%d", &start);

                if(start >= 0 && start < n) {
                    for(i = 0; i < n; i++)
                        visited[i] = 0;

                    printf("DFS: ");
                    DFS(start);
                    printf("\n");
                }
                else
                    printf("Invalid user!\n");
                break;

            case 4:
                printf("Exiting...\n");
                break;

            default:
                printf("Invalid choice!\n");
        }
    } while(choice != 4);

    return 0;
}`,

void initTable() {
    for (int i = 0; i < TABLE_SIZE; i++) {
        hashTable[i].bookID = -1;
        hashTable[i].isOccupied = false;
        hashTable[i].isDeleted = false;
    }
}

// Hash function
int hashFunction(int key) {
    return key % TABLE_SIZE;
}

// a. Insert book ID using linear probing
void insertBook(int bookID) {
    int hashIndex = hashFunction(bookID);
    int originalIndex = hashIndex;
    int i = 0;

    // Linear probing for finding an empty or deleted slot
    while (hashTable[hashIndex].isOccupied && hashTable[hashIndex].bookID != bookID) {
        i++;
        hashIndex = (originalIndex + i) % TABLE_SIZE;

        // If we have looped through the entire table
        if (hashIndex == originalIndex) {
            printf("Error: Hash table is full. Could not insert Book ID %d.\n", bookID);
            return;
        }
    }

    hashTable[hashIndex].bookID = bookID;
    hashTable[hashIndex].isOccupied = true;
    hashTable[hashIndex].isDeleted = false;
    printf("Inserted Book ID %d at index %d.\n", bookID, hashIndex);
}

// b. Search for a specific book ID
int searchBook(int bookID) {
    int hashIndex = hashFunction(bookID);
    int originalIndex = hashIndex;
    int i = 0;

    while (hashTable[hashIndex].isOccupied || hashTable[hashIndex].isDeleted) {
        if (hashTable[hashIndex].isOccupied && hashTable[hashIndex].bookID == bookID) {
            return hashIndex; // Found
        }
        i++;
        hashIndex = (originalIndex + i) % TABLE_SIZE;

        if (hashIndex == originalIndex) {
            break; // Full circle
        }
    }
    return -1; // Not found
}

// Display the contents of the hash table
void displayTable() {
    printf("\n--- Library Hash Table ---\n");
    printf("Index\tBook ID\t\tStatus\n");
    for (int i = 0; i < TABLE_SIZE; i++) {
        printf("%d\t", i);
        if (hashTable[i].isOccupied) {
            printf("%d\t\tOccupied\n", hashTable[i].bookID);
        } else if (hashTable[i].isDeleted) {
            printf("-\t\tDeleted\n");
        } else {
            printf("-\t\tEmpty\n");
        }
    }
    printf("--------------------------\n");
}

// Main function to test the program
int main() {
    initTable();

    // Insert sample Book IDs
    insertBook(101);
    insertBook(111); // Collides with 101 (111 % 10 = 1, 101 % 10 = 1) -> probes next index
    insertBook(203);
    insertBook(55);
    insertBook(45);  // Collides with 55

    displayTable();

    // Search for a book ID
    int searchID = 111;
    int pos = searchBook(searchID);

document.querySelectorAll("[data-practical]").forEach(button => {
  button.addEventListener("click", async () => {
    const code = practicalCodes[button.dataset.practical];
    const status = document.getElementById("status");

    try {
      await navigator.clipboard.writeText(code);

      status.textContent =
        "Practical " + button.dataset.practical + " code copied!";

      const original = button.innerHTML;

      button.innerHTML =
        '<span class="num">COPIED</span><span class="title">Practical ' +
        button.dataset.practical + '</span>';

      setTimeout(() => {
        button.innerHTML = original;
      }, 1100);

    } catch (error) {
      status.textContent =
        "Clipboard access failed. Open this page in a browser with clipboard permission.";
    }
  });
});
